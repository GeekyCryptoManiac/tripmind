name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  # Hardcoded lowercase — GHCR/OCI registries reject mixed-case repo
  # names, and the GitHub owner here ("GeekyCryptoManiac") is mixed
  # case, so `${{ github.repository }}` can't be used directly in tags.
  IMAGE_NAME: ghcr.io/geekycryptomaniac/tripmind/tripmind-backend

jobs:
  # ── Job 1: Run tests ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripmind_test
          DATABASE_URL:      postgresql://postgres:postgres@localhost:5432/tripmind_test
          SECRET_KEY:        test-secret-key-for-ci-only
          OPENAI_API_KEY:    sk-test-placeholder
          FRONTEND_URL:      http://localhost:5173

  # ── Job 2: Build and push — runs on the Actions runner (real ──
  # CPU/RAM, free), never on the EC2 host. Produces the exact image
  # the deploy job will later pull.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── Job 3: Deploy — pulls the pre-built image and runs it. ────
  # No build ever happens here — the EC2 host only pulls + starts.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e

            cd ~/tripmind
            git fetch origin main
            git reset --hard origin/main

            cd backend

            # Refresh secrets from SSM into .env.prod
            REGION="ap-southeast-1"
            DATABASE_URL=$(aws ssm get-parameter --name "/tripmind/prod/DATABASE_URL" --with-decryption --query "Parameter.Value" --output text --region "$REGION")
            OPENAI_API_KEY=$(aws ssm get-parameter --name "/tripmind/prod/OPENAI_API_KEY" --with-decryption --query "Parameter.Value" --output text --region "$REGION")
            SECRET_KEY=$(aws ssm get-parameter --name "/tripmind/prod/SECRET_KEY" --with-decryption --query "Parameter.Value" --output text --region "$REGION")
            DEBUG=$(aws ssm get-parameter --name "/tripmind/prod/DEBUG" --query "Parameter.Value" --output text --region "$REGION")
            FRONTEND_URL=$(aws ssm get-parameter --name "/tripmind/prod/FRONTEND_URL" --query "Parameter.Value" --output text --region "$REGION")

            cat > .env.prod << EOF
            DATABASE_URL=$DATABASE_URL
            OPENAI_API_KEY=$OPENAI_API_KEY
            SECRET_KEY=$SECRET_KEY
            DEBUG=$DEBUG
            FRONTEND_URL=$FRONTEND_URL
            EOF

            # Log in to ghcr.io to pull the image the build job just pushed
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Pull the pre-built image, then start it — no local build
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Remove the now-orphaned old image layers
            docker image prune -f

            echo "Deploy complete."
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
