services:

  db:
    image: postgres:15-alpine
    container_name: tripmind-db-1
    restart: always
    env_file:
      - .env.prod   # must define POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tripmind_net

  backend:
    image: ghcr.io/geekycryptomaniac/tripmind/tripmind-backend:latest
    container_name: tripmind_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.prod   # DATABASE_URL must point at the `db` service, e.g.
                     # postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>
                     # — not the old RDS endpoint.
    volumes:
      - ./uploads:/app/uploads   # persist trip photos across deploys
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tripmind_net

volumes:
  postgres_data:
    external: true
    name: tripmind_postgres_data

networks:
  tripmind_net:
    name: tripmind_net
